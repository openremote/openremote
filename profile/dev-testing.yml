# OpenRemote v3
#
# Profile for doing IDE development work and running build tests.
#
# Please see profile/deploy.yml for configuration details for each service.
#
volumes:
  postgresql-data:
services:
  keycloak:
    extends:
      file: deploy.yml
      service: keycloak
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # manager has a different base URL and is assumed to be reachable at this URL
      OR_MANAGER_URL: ${OR_MANAGER_URL:-http://127.0.0.1:8080}

  postgresql:
    extends:
      file: deploy.yml
      service: postgresql
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    # Access directly if needed on localhost
    ports:
      - "5432:5432"
