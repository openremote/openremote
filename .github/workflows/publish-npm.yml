name: NPM
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      NPM_AUTH_TOKEN:
        required: true

jobs:
  npm-publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: or-ui-component-build
          path: ui/component

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: or-ui-app-build
          path: ui/app

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: or-ui-util-build
          path: ui/util

      - name: Update when the `tsbuildinfo` files were last modified to 'now'
        run: find . -name "*.tsbuildinfo" -exec touch {} +

      - run: yarn --immutable

      - name: Publish to NPM
        run: |
          echo 'npmRegistries:' >> .yarnrc.yml
          echo '  "https://registry.yarnpkg.com":' >> .yarnrc.yml
          echo "    npmAuthToken: ${{ secrets.NPM_AUTH_TOKEN }}" >> .yarnrc.yml
          yarn workspaces foreach --all --no-private --topological npm publish --tag ${{ inputs.tag }}
