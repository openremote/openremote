# This workflow only exists to allow manual deployments e.g. to test servers.
#
# It leverages existing reusable workflows similar to the staging.yml environment workflow but unlike the staging.yml workflow
# it only includes the required jobs for deployments: install-dist, build-manager-image and deploy.
name: Deploy

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Environment to use (if any)"
      MANAGER_TAG:
        description: "Manager docker tag to pull"
      CLEAN_INSTALL:
        description: "Delete data before starting"
        type: boolean
      COMMIT:
        description: "Repo branch or commit SHA to checkout. WARNING: Picking an older commit may cause pipeline failures if build/deploy steps are missing or incompatible."
      OR_HOSTNAME:
        description: "Host to deploy to (e.g. demo.openremote.app)"
      OR_ADMIN_PASSWORD:
        description: "Admin password override"

  workflow_call:
    inputs:
      INPUTS:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-core-repo:
    name: Is core repository
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.is_core_repo.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check if core repo
        id: is_core_repo
        uses: openremote/core/.github/actions/check-if-core-repo@357f1387fbc99e7a59752a62064f0bdade57612d

  install-dist:
    name: Build
    needs: is-core-repo
    if: ${{ needs.is-core-repo.outputs.value == 'true' }}
    uses: "./.github/workflows/install-dist.yml"
    with:
      COMMIT: ${{ inputs.COMMIT }}

  deployment:
    name: Deployment
    needs: install-dist
    if: always() && !cancelled() && (needs.install-dist.result == 'success' || needs.install-dist.result == 'skipped')
    uses: "./.github/workflows/deployment.yml"
    with:
      INPUTS: ${{ toJSON(inputs) }}
      COMMIT: ${{ inputs.COMMIT }}
    secrets: inherit
