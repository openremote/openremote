name: Extensions

on:
  workflow_call:
    inputs:
      version:
        type: string
      is_release:
        type: string
    secrets:
      CI_AUTOMATION_APP_CLIENT_ID:
        required: true
      CI_AUTOMATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  check-artifacts:
    name: Check if artifacts are available
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          chmod +x .ci_cd/check_artifacts.sh
          .ci_cd/check_artifacts.sh "${{ inputs.version }}" "${{ inputs.is_release }}"

  update-openremote-version:
    name: Update OpenRemote version in gradle/libs.versions.toml
    runs-on: ubuntu-latest
    needs: check-artifacts
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Create extensions contents token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_AUTOMATION_APP_PRIVATE_KEY }}
          owner: openremote
          repositories: extensions
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openremote/extensions
          path: extensions
          ref: main
          sparse-checkout: gradle/libs.versions.toml
          token: ${{ steps.app-token.outputs.token }}

      - name: Update OpenRemote version in gradle/libs.versions.toml
        run: |
          CURRENT=$(grep '^openremote = ' extensions/gradle/libs.versions.toml | sed -E 's/^openremote = "([^\"]+)".*/\1/' | head -n 1)
          if [ "$CURRENT" != "$VERSION" ]; then
            sed -i "s/^openremote = .*/openremote = \"$VERSION\"/" extensions/gradle/libs.versions.toml
            git -C extensions add gradle/libs.versions.toml
            git -C extensions -c user.name="openremote-ci-automation[bot]" -c user.email="309709051+openremote-ci-automation[bot]@users.noreply.github.com" commit -m "Update OpenRemote version to $VERSION [skip ci]"
            git -C extensions push
          else
            echo "Version unchanged, skipping commit."
          fi
        env:
          VERSION: ${{ inputs.version }}

  create-extensions-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [ check-artifacts, update-openremote-version ]
    if: ${{ inputs.is_release == 'true' }}
    steps:
      - name: Create extensions release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_AUTOMATION_APP_PRIVATE_KEY }}
          owner: openremote
          repositories: extensions
          permission-contents: write

      - run: gh release create "${{ inputs.version }}" -R openremote/extensions --generate-notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  trigger-extensions-ci-cd:
    name: Run CI/CD
    runs-on: ubuntu-latest
    needs: check-artifacts
    steps:
      - name: Create extensions Actions token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_AUTOMATION_APP_PRIVATE_KEY }}
          owner: openremote
          repositories: extensions
          permission-actions: write

      - run: gh workflow run ci_cd.yml -R openremote/extensions -f version="${{ inputs.version }}" -f is_release="${{ inputs.is_release }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
