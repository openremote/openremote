name: Check if core repo
description: Resolves- and checks if it is run from the core repository, and resolves the OpenRemote version

outputs:
  value:
    description: Whether this is the core repository which builds the manager
    value: ${{ steps.is_core_repo.outputs.value }}
  repository:
    description: The core GitHub repository name
    value: ${{ steps.is_core_repo.outputs.repository }}
  version:
    description: The openremote version defined in the core repo
    value: ${{ steps.is_core_repo.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check if core repo
      id: is_core_repo
      shell: bash
      run: |
        if [ -f manager/src/main/java/org/openremote/manager/Main.java ]; then
          echo "value=true" >> $GITHUB_OUTPUT
        else
          if [ -e 'openremote' ]; then
            echo "::error::openremote submodule no longer supported, see custom project template!"
            exit 1
          fi

          echo "value=false" >> $GITHUB_OUTPUT
          echo "repository=$(sed -E 's#(.+)/.+#\1/core#' <<< $GITHUB_REPOSITORY)" >> $GITHUB_OUTPUT

          version=""
          if [ -f gradle/libs.versions.toml ]; then
            version=$(sed -nE 's/^[[:space:]]*openremote[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' gradle/libs.versions.toml)
          fi

          if [ -z "$version" ] && [ -f gradle.properties ]; then
            version=$(sed -nE 's/^[[:space:]]*openremoteVersion[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' gradle.properties)
            if [ -n "$version" ]; then
              echo "::warning file=gradle.properties,title=Deprecated version configuration::Move openremoteVersion from gradle.properties to openremote in gradle/libs.versions.toml"
            fi
          fi

          if [ -z "$version" ]; then
            echo "::error::openremote version must be set in gradle/libs.versions.toml"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
        fi
