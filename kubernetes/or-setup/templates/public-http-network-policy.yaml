{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.publicHttp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openremote-public-http-ingress
spec:
  podSelector:
    {{- toYaml .Values.networkPolicy.publicHttp.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    # Omitting `from` permits traffic from the external ingress data plane,
    # while this rule remains limited to the selected Pods and HTTP ports.
    - ports:
        {{- toYaml .Values.networkPolicy.publicHttp.ports | nindent 8 }}
{{- end }}
